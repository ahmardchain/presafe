name: Contract tests

on:
  push:
    branches: [main]
    paths: ["contract/**", ".github/workflows/contract-tests.yml"]
  pull_request:
    paths: ["contract/**", ".github/workflows/contract-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build contracts, unit tests, sandbox integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.97.0 with the wasm target
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.97.0

      - name: System packages for cargo-near
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
          cache-bin: true

      - name: Install cargo-near 0.23.0
        run: cargo near --version || cargo install cargo-near --version 0.23.0 --locked

      - name: Run all contract tests
        run: contract/run-tests.sh
