[package]
name = "presafe-spike-recorder"
version = "0.1.0"
edition = "2021"
description = "Throwaway contract: records what 1Click delivers through ft_transfer_call. Not part of the product."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

