[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Sandbox integration tests for Presafe. Build the wasm first: see README."

[lib]
path = "src/lib.rs"

[dev-dependencies]
near-sandbox = "=0.4.0"
near-api = "=0.8.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
anyhow = "1"
